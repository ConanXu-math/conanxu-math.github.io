<header>
  <nav class="navbar navbar-light fixed-top" aria-label="{{ ui.menu }}">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}"><strong>Conan</strong> Xu</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">{{ ui.menu }} <span aria-hidden="true">☰</span></button>
      <div id="site-menu" class="site-menu">
        <ul class="navbar-nav">
          <li><a href="{{ '/' | relative_url }}"{% if page.layout == 'about' %} aria-current="page"{% endif %}>{{ ui.home }}</a></li>
          <li><a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>{{ ui.research }}</a></li>
          <li><a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>{{ ui.projects }}</a></li>
          <li><a href="{{ '/blog/' | relative_url }}"{% if page.layout == 'post' or page.layout == 'blog' %} aria-current="page"{% endif %}>{{ ui.blog }}</a></li>
        </ul>
        {% include language-switch.html %}
        <div class="nav-tools">
          <button type="button" class="tool-button" id="search-open" aria-label="{{ ui.search }}" title="{{ ui.search }}"><span class="search-icon" aria-hidden="true"></span></button>
          <button type="button" class="tool-button" id="theme-toggle" aria-label="{{ ui.theme }}" title="{{ ui.theme }}"><span class="theme-icon" aria-hidden="true">◐</span></button>
        </div>
      </div>
    </div>
  </nav>
</header>
