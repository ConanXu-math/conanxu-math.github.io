{% assign language_prefix = '' %}{% if site.active_lang != site.default_lang %}{% assign language_prefix = '/' | append: site.active_lang %}{% endif %}
<dialog id="search-dialog" aria-labelledby="search-title" data-search-url="{{ language_prefix }}/assets/js/data/search.json" data-empty="{{ ui.search_empty }}" data-failed="{{ ui.search_failed }}">
  <div class="search-heading"><h2 id="search-title">{{ ui.search }}</h2><button type="button" id="search-close" aria-label="{{ ui.close }}">×</button></div>
  <label class="sr-only" for="search-input">{{ ui.search }}</label>
  <input type="search" id="search-input" placeholder="{{ ui.search_placeholder }}" autocomplete="off">
  <p id="search-status" role="status">{{ ui.search_hint }}</p>
  <ul id="search-results"></ul>
</dialog>
