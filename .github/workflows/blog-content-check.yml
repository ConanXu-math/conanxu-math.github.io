name: Check optimization article

on:
  pull_request:
    branches: [codex/personal-homepage]
    paths:
      - '_posts/2026-11-14-optimization-convergence-map.zh-CN.md'
      - '_layouts/default.html'
      - 'assets/js/mermaid.js'
      - '.github/scripts/check-optimization-post.mjs'
      - '.github/workflows/blog-content-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build the website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Install browser and Markdown test dependencies
        run: npm install --prefix .blog-check --no-package-lock --no-audit --no-fund playwright@1.62.0 unified@11.0.5 remark-parse@11.0.0 remark-math@6.0.0 remark-gfm@4.0.1 remark-frontmatter@5.0.0 unist-util-visit@5.0.0 http-server@14.1.1
      - name: Install Chromium
        run: node .blog-check/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check formulas, diagrams, links, and themes
        run: node .github/scripts/check-optimization-post.mjs
      - name: Save the built website
        uses: actions/upload-artifact@v4
        with:
          name: optimization-article-preview
          path: _site
          retention-days: 7
