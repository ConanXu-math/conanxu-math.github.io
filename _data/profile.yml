zh-CN:
  subtitle: AI4Math · 优化算法 · 生成模型 · 形式化验证
  bio: |
    我是徐柯楠，目前是**华东师范大学数学专业硕士生**，2025 年入学。本科于 2021–2025 年就读于宁波大学数学与应用数学专业。我的研究方向是数学优化与人工智能的交叉，主要包括优化器设计、AI 辅助算法研究和生成模型。

    近期工作包括 Flow Matching 少步蒸馏中的分布补偿，以及 Muon 优化器的谱变换机制。在凸优化方面，我构造并精确验证了[三块 ADMM 的周期 66 反例](/blog/admm-counterexample/)，并研究局部吸引周期与乘子松弛。

    在 AutoADMM 项目中，我结合演化搜索和数值评测研究罚参数策略，并用 Lean 4 描述优化问题、KKT 条件和收敛分析接口。我也参与了 RealMath-Eval，研究大模型对真实数学作答的评分能力。

    工程工作主要是昇腾 NPU 上的算子开发与大模型推理优化，使用 Ascend C、vLLM-Ascend 和 ACL 图等工具。我还参与 AI4Math Skills 和 VeryMath 项目，开发数学科研与学习工具，并在[博客](/blog/)记录推导与实验。
  paper_title: AI 辅助发现与构造三块 ADMM 的不收敛反例
  paper_description: 当第三个约束块为单位阵时，直接三块 ADMM 仍可能不收敛。通过周期轨道研究这一结构的边界，并探索 AI 辅助数学发现的过程。
  lean_title: Adaptive ADMM in Lean
  lean_description: 用 Lean 4 形式化自适应 ADMM 的收敛性分析，把算法、参数策略与数学假设之间的关系写清楚。
  lean_status: 形式化数学 · 开源项目
  course_title: VeryMath 智慧教材
  course_description: 围绕教材阅读的学习工作台，把教材、提问、讲解与学习资料放在一起。
en:
  subtitle: AI4Math · Optimization · Generative Models · Formal Verification
  bio: |
    I am a **master's student in Mathematics at East China Normal University**, where I enrolled in 2025. I received my BSc in Mathematics and Applied Mathematics from Ningbo University, where I studied from 2021 to 2025. My research interests lie at the intersection of mathematical optimization and AI, including optimizer design, AI-assisted algorithm research, and generative models.

    My recent work includes distribution compensation for few-step Flow Matching distillation and spectral transformations in the Muon optimizer. In convex optimization, I constructed and exactly verified a [period-66 counterexample for direct three-block ADMM](/blog/admm-counterexample/), and studied locally attracting cycles and multiplier relaxation.

    In AutoADMM, I combine evolutionary search and numerical evaluation to study penalty-parameter strategies, and use Lean 4 to describe optimization problems, KKT conditions, and interfaces for convergence analysis. I also contributed to RealMath-Eval, studying how language models assess real human mathematical answers.

    My engineering work focuses on operator development and LLM inference optimization on Ascend NPUs, using Ascend C, vLLM-Ascend, and ACL graphs. I also contribute to AI4Math Skills and VeryMath, build tools for mathematical research and learning, and keep a [blog](/blog/) for derivations and experiments.
  paper_title: AI-assisted discovery of counterexamples for three-block ADMM
  paper_description: Direct three-block ADMM can fail even when its third constraint block is the identity. Periodic orbits expose the limits of this structure and provide a case study in AI-assisted mathematical discovery.
  lean_title: Adaptive ADMM in Lean
  lean_description: Formalizing convergence analysis for adaptive ADMM in Lean 4, making the connections between algorithms, parameter strategies, and mathematical assumptions explicit.
  lean_status: Formal mathematics · Open source
  course_title: VeryMath Course Copilot
  course_description: A study workspace that keeps textbooks, questions, explanations, and learning materials together.
